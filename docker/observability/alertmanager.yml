global:
  smtp_smarthost: "ow-mailhog:1025"
  smtp_from: "alerts@openwind.local"
  smtp_require_tls: false

route:
  group_by: ["alertname", "queue_name", "route"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 3h
  receiver: "mailhog"

receivers:
  - name: "mailhog"
    email_configs:
      - to: "admin@openwind.local"
        send_resolved: true
