groups:
  - name: openwind-alerts
    rules:
      - alert: QueueDepthHighPlatform
        expr: bullmq_queue_depth{status="waiting", queue_name=~"notify|connector-outbound"} > 500
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "BullMQ high-volume queue {{ $labels.queue_name }} has a high depth of waiting jobs"
          description: "Queue {{ $labels.queue_name }} has {{ $value }} jobs in waiting state for more than 5 minutes."

      - alert: QueueDepthHighWorker
        expr: bullmq_queue_depth{status="waiting", queue_name!~"notify|connector-outbound"} > 50
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "BullMQ queue {{ $labels.queue_name }} has a high depth of waiting jobs"
          description: "Queue {{ $labels.queue_name }} has {{ $value }} jobs in waiting state for more than 5 minutes."

      - alert: HttpErrorRateHigh
        expr: sum by (route) (rate(http_requests_total{status=~"5.."}[5m])) / sum by (route) (rate(http_requests_total[5m])) * 100 > 2
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "HTTP error rate is high on route {{ $labels.route }}"
          description: 'HTTP 5xx error rate on route {{ $labels.route }} is {{ $value | printf "%.2f" }}% over the last 5 minutes.'

      - alert: HttpLatencyHigh
        expr: histogram_quantile(0.95, sum by (le, route) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "HTTP request latency is high on route {{ $labels.route }}"
          description: 'P95 request latency on route {{ $labels.route }} is {{ $value | printf "%.2f" }}s over the last 5 minutes.'

      - alert: OncallCoverageGapsDetected
        expr: openwind_oncall_coverage_gap_teams > 0
        for: 10m
        labels:
          severity: info
          team: platform
        annotations:
          summary: "{{ $value }} team(s) have no active on-call schedule for tenant {{ $labels.tenant_id }}"

      - alert: NotificationChannelHighFailureRate
        expr:
          sum by (channel) (rate(openwind_notification_dispatch_total{outcome="channel_failed"}[5m]))
          / sum by (channel) (rate(openwind_notification_dispatch_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Notification channel {{ $labels.channel }} failure rate > 10%"

      # docs/oncall-routing-design.md §9.4. 15m window, not 5m: a resolution is
      # recorded only when a ticket's team changes, so they can be hours apart,
      # and a short window leaves one slow resolution in range for fewer than the
      # `for` duration (see ScheduleExecutionDurationSLOBreach). Quantile over
      # sum by (le) of rate(); the design's bare form is not valid PromQL.
      - alert: OncallResolutionSLOBreached
        expr: histogram_quantile(0.99, sum by (le) (rate(openwind_oncall_resolution_duration_seconds_bucket[15m]))) > 0.1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "resolve_oncall p99 latency is over 100ms"
          description: "P99 resolve_oncall duration is {{ $value | humanizeDuration }} over the last 15 minutes."

      # docs/temporal-scheduler-design.md §9.4. The design's quantile PromQL
      # (histogram_quantile over a bare metric name) is not valid; a quantile
      # needs sum by (le) of rate() over the _bucket series.
      # `$value` is a 0-1 fraction here, hence humanizePercentage; the HTTP rules
      # above multiply by 100 and use printf "%.2f%%" instead.
      - alert: ScheduleExecutionFailureRateHigh
        expr: sum(rate(openwind_schedule_execution_total{status="failed"}[10m]))
          / sum(rate(openwind_schedule_execution_total[10m])) > 0.10
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "More than 10% of schedule rule fires are failing"
          description: "Schedule rule fires failed at {{ $value | humanizePercentage }} over the last 10 minutes."

      - alert: ScheduleTickDurationSLOBreach
        expr: histogram_quantile(0.99, sum by (le) (rate(openwind_schedule_tick_duration_ms_bucket[5m]))) > 5000
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Scheduler tick p99 duration is over 5s"
          description: 'P99 scheduler tick duration is {{ $value | printf "%.0f" }}ms over the last 5 minutes.'

      # 15m window, unlike the tick rule: a fire is recorded only when a rule is
      # due, so fires can be hours apart. A single slow fire is in a rate()
      # window for exactly that window; with 5m it is true for about 5
      # evaluations and `for: 5m` is never satisfied, so the alert would be dead.
      # Deliberately counts success and failure together: the SLO is how long a
      # fire takes, and a fire that hangs for 30s and then fails is exactly what
      # it should catch. It can fire alongside ScheduleExecutionFailureRateHigh.
      - alert: ScheduleExecutionDurationSLOBreach
        expr: histogram_quantile(0.99, sum by (le) (rate(openwind_schedule_execution_duration_ms_bucket[15m]))) > 10000
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Schedule rule fire p99 duration is over 10s"
          description: 'P99 time to fire one schedule rule is {{ $value | printf "%.0f" }}ms over the last 15 minutes.'

      # OpenBao (ADR-023 Decision 4; docs/runbooks/openbao-secrets.md). OpenWind
      # services can't start while OpenBao is down or sealed. Both rules stay
      # quiet until the "openbao" scrape job in prometheus.yml is enabled: with
      # no job there is no series to match. vault_core_unsealed is the gauge
      # name OpenBao inherits from Vault's telemetry; confirm it in the server's
      # /v1/sys/metrics output when enabling the job.
      - alert: OpenBaoDown
        expr: up{job="openbao"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "OpenBao is not answering Prometheus scrapes"
          description: "Scrapes of {{ $labels.instance }} have failed for more than 2 minutes. OpenWind services cannot start until OpenBao is back."

      - alert: OpenBaoSealed
        expr: vault_core_unsealed{job="openbao"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "OpenBao is sealed"
          description: "{{ $labels.instance }} has been sealed for more than 2 minutes. OpenWind services cannot start until it is unsealed."
