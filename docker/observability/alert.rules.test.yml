# promtool tests for the scheduler alerts in alert.rules.yml
# (docs/temporal-scheduler-design.md §9.4).
#
# Run from the repo root with `pnpm test:alerts` (needs Docker; it also runs
# `promtool check rules`). CI does not run this file, so run it after changing
# alert.rules.yml. The raw command is:
#   docker run --rm --entrypoint promtool -v "$PWD/docker/observability:/r:ro" \
#     prom/prometheus:v2.53.0 test rules /r/alert.rules.test.yml
#
# The histogram series use the bucket boundaries in
# packages/telemetry/src/schedule-duration-buckets.ts.
rule_files:
  - alert.rules.yml

evaluation_interval: 1m

tests:
  - name: more than 10% of fires failing raises ScheduleExecutionFailureRateHigh
    interval: 1m
    input_series:
      - series: 'openwind_schedule_execution_total{status="success"}'
        values: "0+80x30"
      - series: 'openwind_schedule_execution_total{status="failed",errorCode="ENTITY_TYPE_NOT_FOUND"}'
        values: "0+20x30"
    alert_rule_test:
      - eval_time: 3m
        alertname: ScheduleExecutionFailureRateHigh
        exp_alerts: []
      - eval_time: 15m
        alertname: ScheduleExecutionFailureRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
            exp_annotations:
              summary: "More than 10% of schedule rule fires are failing"
              description: "Schedule rule fires failed at 20% over the last 10 minutes."

  - name: a failure rate at or under 10% stays quiet
    interval: 1m
    input_series:
      - series: 'openwind_schedule_execution_total{status="success"}'
        values: "0+95x30"
      - series: 'openwind_schedule_execution_total{status="failed",errorCode="ENTITY_TYPE_NOT_FOUND"}'
        values: "0+5x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ScheduleExecutionFailureRateHigh
        exp_alerts: []

  - name: fires with no failed series at all stay quiet, not a divide-by-nothing alert
    interval: 1m
    input_series:
      - series: 'openwind_schedule_execution_total{status="success"}'
        values: "0+80x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ScheduleExecutionFailureRateHigh
        exp_alerts: []

  - name: a Superset erasure that spent every retry raises SupersetErasureFailed
    interval: 1m
    input_series:
      - series: 'openwind_superset_erasure_total{outcome="completed"}'
        values: "0+1x30"
      - series: 'openwind_superset_erasure_total{outcome="failed"}'
        values: "0x10 1x20"
    alert_rule_test:
      - eval_time: 5m
        alertname: SupersetErasureFailed
        exp_alerts: []
      - eval_time: 12m
        alertname: SupersetErasureFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              outcome: failed
            exp_annotations:
              summary: "A Superset erasure did not complete (failed)"
              description: "1 Superset erasure(s) with outcome failed in the last hour (failed: ran out of retries; not_queued: could not be queued). Personal data may remain in Superset; follow docs/runbooks/superset-erasure.md."

  - name: an erasure that could not be queued raises SupersetErasureFailed
    interval: 1m
    input_series:
      - series: 'openwind_superset_erasure_total{outcome="not_queued"}'
        values: "0x10 1x20"
    alert_rule_test:
      - eval_time: 5m
        alertname: SupersetErasureFailed
        exp_alerts: []
      - eval_time: 15m
        alertname: SupersetErasureFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              outcome: not_queued
            exp_annotations:
              summary: "A Superset erasure did not complete (not_queued)"
              description: "1 Superset erasure(s) with outcome not_queued in the last hour (failed: ran out of retries; not_queued: could not be queued). Personal data may remain in Superset; follow docs/runbooks/superset-erasure.md."

  - name: successful erasures alone stay quiet
    interval: 1m
    input_series:
      - series: 'openwind_superset_erasure_total{outcome="completed"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: SupersetErasureFailed
        exp_alerts: []

  - name: a failed job left in the superset-erasure queue raises SupersetErasureJobFailedInQueue
    interval: 1m
    input_series:
      - series: 'bullmq_queue_depth{queue_name="superset-erasure",status="failed"}'
        values: "0x5 1x30"
      - series: 'bullmq_queue_depth{queue_name="superset-erasure",status="waiting"}'
        values: "0x35"
    alert_rule_test:
      - eval_time: 8m
        alertname: SupersetErasureJobFailedInQueue
        exp_alerts: []
      - eval_time: 15m
        alertname: SupersetErasureJobFailedInQueue
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              queue_name: superset-erasure
              status: failed
            exp_annotations:
              summary: "A failed Superset erasure job is waiting in the queue"
              description: "1 superset-erasure job(s) are in the failed state. Personal data may remain in Superset; follow docs/runbooks/superset-erasure.md."

  - name: other queues with failed jobs do not raise SupersetErasureJobFailedInQueue
    interval: 1m
    input_series:
      - series: 'bullmq_queue_depth{queue_name="export",status="failed"}'
        values: "3x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: SupersetErasureJobFailedInQueue
        exp_alerts: []

  - name: the first failure of a process still raises SupersetErasureFailed because the counter starts at zero
    interval: 1m
    input_series:
      - series: 'openwind_superset_erasure_total{outcome="failed"}'
        values: "0x10 1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: SupersetErasureFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              outcome: failed
            exp_annotations:
              summary: "A Superset erasure did not complete (failed)"
              description: "1 Superset erasure(s) with outcome failed in the last hour (failed: ran out of retries; not_queued: could not be queued). Personal data may remain in Superset; follow docs/runbooks/superset-erasure.md."

