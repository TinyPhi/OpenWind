        alertname: ScheduleExecutionDurationSLOBreach
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
            exp_annotations:
              summary: "Schedule rule fire p99 duration is over 10s"
              description: "P99 time to fire one schedule rule is 29800ms over the last 15 minutes."

  - name: fast fires stay quiet
    interval: 1m
    input_series:
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="50"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="100"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="250"}'
        values: "0+1x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="500"}'
        values: "0+1x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="1000"}'
        values: "0+1x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="2500"}'
        values: "0+1x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="5000"}'
        values: "0+1x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="7500"}'
        values: "0+1x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="10000"}'
        values: "0+1x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="30000"}'
        values: "0+1x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="60000"}'
        values: "0+1x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="+Inf"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ScheduleExecutionDurationSLOBreach
        exp_alerts: []

  # Why the buckets run past 10000: when every observation overflows the top
  # finite bucket, histogram_quantile returns that bucket's bound, so with OTel's
  # default boundaries (top bucket 10000) a 12s fire gives p99 = 10000 and
  # `> 10000` is false. The rule could never fire. This case documents that.
  - name: with OTel default buckets an overflowing fire cannot alert (the bug the extra buckets fix)
    interval: 1m
    input_series:
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="0"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="5"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="10"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="25"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="50"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="75"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="100"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="250"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="500"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="750"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="1000"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="2500"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="5000"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="7500"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="10000"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="+Inf"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ScheduleExecutionDurationSLOBreach
        exp_alerts: []

  - name: with the scheduler buckets a fire that overflows even the top bucket still alerts
    interval: 1m
    input_series:
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="50"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="100"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="250"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="500"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="1000"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="2500"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="5000"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="7500"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="10000"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="30000"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="60000"}'
        values: "0x30"
      - series: 'openwind_schedule_execution_duration_ms_bucket{le="+Inf"}'
        values: "0+1x30"
    alert_rule_test:
