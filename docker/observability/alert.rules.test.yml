      - series: 'openwind_schedule_tick_duration_ms_bucket{le="100"}'
        values: "0x49"
      - series: 'openwind_schedule_tick_duration_ms_bucket{le="250"}'
        values: "0x49"
      - series: 'openwind_schedule_tick_duration_ms_bucket{le="500"}'
        values: "0x49"
      - series: 'openwind_schedule_tick_duration_ms_bucket{le="1000"}'
        values: "0x49"
      - series: 'openwind_schedule_tick_duration_ms_bucket{le="2500"}'
        values: "0x49"
      - series: 'openwind_schedule_tick_duration_ms_bucket{le="5000"}'
