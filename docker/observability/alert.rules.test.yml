  # The trap the second-scale buckets avoid: OTel's default boundaries are
  # millisecond-scale (0, 5, 10 ... 10000), so a 20ms resolution recorded in
  # seconds (0.02) lands in the le="5" bucket and reads as p99 = 4.95s.
  - name: with OTel default (millisecond-scale) buckets a FAST resolution would wrongly page
    interval: 1m
    input_series:
      - series: 'openwind_oncall_resolution_duration_seconds_bucket{le="0"}'
        values: "0x30"
      - series: 'openwind_oncall_resolution_duration_seconds_bucket{le="5"}'
