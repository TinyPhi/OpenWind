name: openwind

# ─────────────────────────────────────────────────────────────────────────────
# Local development environment.
#
# Core services (always started with docker compose up -d):
#   postgres   — Primary database (RLS-enabled, multi-tenant)
#   pgbouncer  — Connection pooler (transaction mode, required for RLS)
#   redis      — Queue backend (BullMQ) + application cache
#   zitadel    — Identity provider (OIDC/OAuth2/SAML)
#   openbao    — Secrets manager (Transit envelope encryption for connector credentials)
#   minio      — S3-compatible object storage (file uploads/presigned URLs)
#   api        — Hono API server (port 3000)
#   admin-ui   — React app with Vite HMR (port 3001) — admin + portal in one app, RBAC-controlled
#
# All users (admin, agent, customer) log in at http://localhost:3001.
# The app reads the role from the JWT and renders the appropriate view.
#
# Optional services (require explicit profile):
#   --profile notifications  → novu-api, novu-worker, novu-web, novu-mongo
#   --profile tools          → mailhog, bullboard
#
# Commands:
#   Start infra:     docker compose up -d
#   Stop:            docker compose down
#   Wipe all data:   docker compose down -v
#   Logs:            docker compose logs -f [service]
#
# App connects to:   postgres://app_user:...@localhost:6432/platform  (PgBouncer)
# OpenBao UI/API:    http://localhost:8200  (token: dev-root-token)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    container_name: ow-database
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform_dev_password
      POSTGRES_DB: platform
      # Enable pg_stat_statements for query performance analysis
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c max_connections=200
        -c shared_buffers=256MB
        -c work_mem=16MB
        -c log_min_duration_statement=1000
        -c log_line_prefix='%t [%p] %u@%d '
        -c log_statement=ddl
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432" # direct postgres for pnpm db:migrate from host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── PgBouncer (connection pooler) ─────────────────────────────────────────
  # Transaction mode is required so SET LOCAL app.tenant_id scoping works
  # correctly — session mode would let the setting leak across pooled connections.
  pgbouncer:
    container_name: ow-pgbouncer
    # pinned 2026-07-24 — this was :latest's resolved digest at pin time, no named
    # version tag published upstream for this image; bump deliberately, in its own commit
    image: edoburu/pgbouncer@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: platform
      DB_USER: app_user
      DB_PASSWORD: app_user_dev_password
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
      SERVER_TLS_SSLMODE: disable
    ports:
      - "6432:5432" # App connects here, not 5432
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U app_user || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── OpenBao (secrets manager) ──────────────────────────────────────────────
  openbao:
    container_name: ow-secrets
    # pinned 2026-07-24 — v2.6.1 (both openbao lines MUST stay on the same version)
    image: openbao/openbao@sha256:5b2486ab0fb90bbc788cc345b0a08616dfb375873ee8be5df3a2fd4d378a67e0
    restart: unless-stopped
    command: server -dev -dev-root-token-id=dev-root-token
    environment:
      BAO_DEV_ROOT_TOKEN_ID: dev-root-token
      BAO_ADDR: http://0.0.0.0:8200
      BAO_LOG_LEVEL: warn
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  openbao-init:
    container_name: ow-secrets-init
    # pinned 2026-07-24 — v2.6.1 (both openbao lines MUST stay on the same version)
    image: openbao/openbao@sha256:5b2486ab0fb90bbc788cc345b0a08616dfb375873ee8be5df3a2fd4d378a67e0
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: dev-root-token
    entrypoint: >
      /bin/sh -c "
        bao secrets enable transit 2>/dev/null || true &&
        bao write -f transit/keys/platform-credentials derived=true &&
        echo 'OpenBao Transit key created with derivation enabled'
      "
    restart: "no"

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    container_name: ow-cache
    image: redis:7-alpine
    restart: unless-stopped
    # No host port mapping: apps/worker runs as a container on this deployment
    # (fully containerized, no host-side `pnpm dev` process reaching in), and
    # ow-backend/worker reach redis over the Docker network by service name.
    # A host mapping here also collides with other projects' redis containers
    # sharing this host on the default 6379 port.
    command: >
      redis-server
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save 60 1000
        --loglevel notice
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── MinIO (local S3) ──────────────────────────────────────────────────────
  minio:
    container_name: ow-storage
    # pinned 2026-07-24 — this was :latest's resolved digest at pin time, no named
    # version tag identified for it in the first 500 published tags; bump deliberately
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: platform_access_key
      MINIO_ROOT_PASSWORD: platform_secret_key_dev_only
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    container_name: ow-storage-init
    # pinned 2026-07-24 — this was :latest's resolved digest at pin time, no named
    # version tag identified for it in the first 500 published tags; bump deliberately
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 platform_access_key platform_secret_key_dev_only &&
        mc mb --ignore-existing local/platform-files &&
        mc anonymous set none local/platform-files &&
        echo 'MinIO bucket initialized'
      "
    restart: "no"

  # ── Novu (Notifications) — profile:notifications ───────────────────────────
  # Not started by default. Run with: docker compose --profile notifications up -d
  novu-api:
    container_name: ow-notify-api
    profiles: [notifications]
    # pinned 2026-07-24 — :latest's resolved digest, built 2026-07-08. NOTE: novu-web's
    # :latest was last rebuilt 2025-03-21 — the three novu-* images are NOT on a matched
    # release line upstream; this pin preserves exactly what was running, not a synced set
    image: ghcr.io/novuhq/novu/api@sha256:d9550e949cf469a3124c6859844863c15881c512fcd2cf5ea2147f8b339fb4e7
    restart: unless-stopped
    environment:
      NODE_ENV: local
      API_ROOT_URL: http://localhost:3010
      FRONT_BASE_URL: http://localhost:4200
      MONGO_URL: mongodb://novu-mongo:27017/novu
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: novu_dev_jwt_secret_change_in_prod
      STORE_ENCRYPTION_KEY: "=<pAs&zYAHF3kRZr"
    ports:
      - "3010:3000"
    depends_on:
      - novu-mongo
      - redis

  novu-worker:
    container_name: ow-notify-worker
    profiles: [notifications]
    # pinned 2026-07-24 — :latest's resolved digest, built 2026-07-08 (see novu-api's note
    # on the novu-*/web version drift)
    image: ghcr.io/novuhq/novu/worker@sha256:83296878d1b633ca5c9a4e39b10283fa8e2c4d5d341c11847ffd1e4a3897f3b0
    restart: unless-stopped
    environment:
      NODE_ENV: local
      MONGO_URL: mongodb://novu-mongo:27017/novu
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: novu_dev_jwt_secret_change_in_prod
      STORE_ENCRYPTION_KEY: "=<pAs&zYAHF3kRZr"
    depends_on:
      - novu-mongo
      - redis

  novu-web:
    container_name: ow-notify-web
    profiles: [notifications]
    # pinned 2026-07-24 — :latest's resolved digest, built 2025-03-21 (see novu-api's note
    # on the novu-*/web version drift — this one is over a year older than api/worker)
    image: ghcr.io/novuhq/novu/web@sha256:f454df7c8d2101a3d600675d75311cf449040db0edc15fbc069cd16d4cb0a993
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:3010
    ports:
      - "4200:4200"

  novu-mongo:
    container_name: ow-notify-db
    profiles: [notifications]
    image: mongo:7
    restart: unless-stopped
    volumes:
      - novu_mongo_data:/data/db

  # ── Mailhog (local email trap) — profile:tools ─────────────────────────────
  mailhog:
    container_name: ow-mailhog
    profiles: [tools]
    # pinned 2026-07-24 — this project has never published a tag besides :latest,
    # so this digest is the only way to freeze it; bump deliberately, in its own commit
    image: mailhog/mailhog@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MH_STORAGE: maildir
      MH_MAILDIR_PATH: /mailhog-data
    volumes:
      - mailhog_data:/mailhog-data

  # ── Bull Board (queue dashboard) — profile:tools ───────────────────────────
  bullboard:
    container_name: ow-bullboard
    profiles: [tools]
    # pinned 2026-07-24 — this project has never published a tag besides :latest,
    # so this digest is the only way to freeze it; bump deliberately, in its own commit
    image: deadly0/bull-board@sha256:afd615426192c7d43d6320aea7d8910835170c8b43e9b755b6c416d38946be93
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USE_TLS: "false"
    ports:
      - "3099:3000"
    depends_on:
      - redis

  # ── API (Hono / Node) ─────────────────────────────────────────────────────
  # Runs with tsx so source changes are picked up on container restart.
  # env_file provides all secrets; environment overrides service URLs so
  # container-to-container networking works (pgbouncer:5432 not localhost:6432).
  ow-backend:
    container_name: ow-backend
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://app_user:app_user_dev_password@pgbouncer:5432/platform
      REDIS_URL: redis://redis:6379
      # Zitadel connection — if ZITADEL_URL is set in .env.local (production / custom deploy)
      # the backend uses that public URL for JWKS and introspection.
      # Without ZITADEL_URL the default falls back to the shared Docker network name
      # (http://zitadel:8080) so local dev continues to work with no extra config.
      ZITADEL_JWKS_URL: ${ZITADEL_URL:-http://zitadel:8080}/oauth/v2/keys
      ZITADEL_INTROSPECTION_URL: ${ZITADEL_URL:-http://zitadel:8080}/oauth/v2/introspect
      OPENBAO_ADDR: http://openbao:8200
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
    # The host's primary DNS resolver has been observed timing out
    # intermittently on external lookups (e.g. the ZITADEL_URL host), which
    # Docker's embedded DNS (127.0.0.11) inherits and fails faster on than
    # the OS does — surfaces as JWKSTimeout -> spurious 401s after login.
    # Keep Docker's embedded resolver first (it resolves sibling container
    # names like redis/postgres/pgbouncer) and fall back to public resolvers
    # only for external lookups — listing only 1.1.1.1/8.8.8.8 here broke
    # in-network service name resolution entirely.
    dns:
      - 127.0.0.11
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    networks:
      - default
      - openwind_zitadel
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      openbao:
        condition: service_healthy

  # ── Worker (BullMQ background jobs — outbox poller, automation, SLA,
  # notifications, file cleanup, AV scan) ─────────────────────────────────────
  # Separate deployable from ow-backend by design (CLAUDE.md repository layout):
  # apps/api serves HTTP + the notification websocket's live push, but the
  # actual outbox polling / automation execution / notification-row creation
  # that feeds that push runs here. Without this service, BullMQ jobs queue up
  # but are never consumed — notifications silently never get created.
  ow-worker:
    container_name: ow-worker
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://app_user:app_user_dev_password@pgbouncer:5432/platform
      MIGRATION_DATABASE_URL: postgresql://migration_user:migration_user_dev_password@postgres:5432/platform
      REDIS_URL: redis://redis:6379
      ZITADEL_JWKS_URL: ${ZITADEL_URL:-http://zitadel:8080}/oauth/v2/keys
      ZITADEL_INTROSPECTION_URL: ${ZITADEL_URL:-http://zitadel:8080}/oauth/v2/introspect
      OPENBAO_ADDR: http://openbao:8200
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
    dns:
      - 127.0.0.11
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    networks:
      - default
      - openwind_zitadel
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      openbao:
        condition: service_healthy

  # ── Admin UI (React + Refine) ──────────────────────────────────────────────
  # Dev mode: Vite dev server with HMR. Source files are mounted as volumes so
  # any change on the host is picked up instantly — no rebuild needed.
  ow-frontend:
    container_name: ow-frontend
    build:
      context: .
      dockerfile: apps/admin-ui/Dockerfile.dev
    ports:
      - "${ADMIN_UI_HOST_PORT:-3001}:3001" # Vite dev server → http://localhost:3001
    environment:
      # admin-ui's API_URL is always the relative "/api" — this makes Vite's dev
      # server proxy it to the backend over the Docker network. Without this,
      # every /api/* request falls through to Vite's SPA fallback and silently
      # returns index.html instead of JSON.
      VITE_API_PROXY_TARGET: http://ow-backend:3000
    volumes:
      - ./apps/admin-ui/src:/app/apps/admin-ui/src
      - ./apps/admin-ui/index.html:/app/apps/admin-ui/index.html
      - ./apps/admin-ui/vite.config.ts:/app/apps/admin-ui/vite.config.ts
      - ./.env.local:/app/.env.local:ro
    restart: unless-stopped

  # ── Bootstrap (one-time setup) — profile:bootstrap ───────────────────────────
  # Runs migrations, seeds the DB, configures Zitadel, and creates demo users.
  # Designed to be idempotent — safe to re-run.
  #
  # Usage:
  #   docker compose --profile bootstrap run --rm bootstrap
  bootstrap:
    container_name: ow-bootstrap
    profiles: [bootstrap]
    build:
      context: .
      dockerfile: Dockerfile.bootstrap
    env_file:
      - path: .env.local
        required: false
    environment:
      RUNNING_IN_DOCKER: "true"
      DATABASE_URL: postgres://app_user:app_user_dev_password@pgbouncer:5432/platform
      MIGRATION_DATABASE_URL: postgres://migration_user:migration_user_dev_password@postgres:5432/platform
      REDIS_URL: redis://redis:6379
      ZITADEL_EXTERNAL_DOMAIN: "${ZITADEL_EXTERNAL_DOMAIN:-localhost}"
      ZITADEL_HOST_PORT: "${ZITADEL_HOST_PORT:-8080}"
      ZITADEL_EXTERNALSECURE: "${ZITADEL_EXTERNALSECURE:-false}"
      # APP_URL is the public base URL of the OpenWind UI (e.g. https://openwind.rokkalabs.com).
      # Bootstrap uses it to register the correct OIDC redirect URIs in Zitadel.
      # Leave empty for local dev — localhost:3001 redirect URIs are always registered.
      APP_URL: "${APP_URL:-}"
      # Passed in by setup.bat/setup.sh via: docker compose run -e ZITADEL_SETUP_PAT=<token>
      # Used on first boot only — after bootstrap saves ZITADEL_KEY_JSON this is no longer needed.
      ZITADEL_SETUP_PAT: "${ZITADEL_SETUP_PAT:-}"
    volumes:
      - ./.env.local:/app/.env.local
    networks:
      - default
      - openwind_zitadel
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: "no"

# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  novu_mongo_data:
  mailhog_data:
  minio_data:
networks:
  openwind_zitadel:
    external: true # created by the zitadel compose project (../zitadel/)
    name: openwind_zitadel
