name: openwind

# ─────────────────────────────────────────────────────────────────────────────
# Local development environment.
#
# Core services (always started with docker compose up -d):
#   postgres   — Primary database (RLS-enabled, multi-tenant)
#   pgbouncer  — Connection pooler (transaction mode, required for RLS)
#   redis      — Queue backend (BullMQ) + application cache
#   zitadel    — Identity provider (OIDC/OAuth2/SAML)
#   openbao    — Secrets manager (Transit envelope encryption for connector credentials)
#   api        — Hono API server (port 3000)
#   admin-ui   — React app with Vite HMR (port 3001) — admin + portal in one app, RBAC-controlled
#
# All users (admin, agent, customer) log in at http://localhost:3001.
# The app reads the role from the JWT and renders the appropriate view.
#
# Commented out (not in use — uncomment when needed):
#   minio      — S3-compatible object storage. packages/files now stores uploads
#                on local disk instead (see docs/specs/local-disk-file-storage.md) —
#                MinIO is kept here commented out only for reference / a possible
#                future return to object storage, not because anything reads from it.
#
# Optional services (require explicit profile):
#   --profile notifications  → novu-api, novu-worker, novu-web, novu-mongo
#   --profile tools          → mailhog, bullboard
#
# Commands:
#   Start infra:     docker compose up -d
#   Stop:            docker compose down
#   Wipe all data:   docker compose down -v
#   Logs:            docker compose logs -f [service]
#
# App connects to:   postgres://app_user:...@localhost:6432/platform  (PgBouncer)
# OpenBao UI/API:    http://localhost:8200  (token: dev-root-token)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    container_name: ow-database
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform_dev_password
      POSTGRES_DB: platform
      # Enable pg_stat_statements for query performance analysis
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c max_connections=200
        -c shared_buffers=256MB
        -c work_mem=16MB
        -c log_min_duration_statement=1000
        -c log_line_prefix='%t [%p] %u@%d '
        -c log_statement=ddl
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Loopback-only (127.0.0.1), not 0.0.0.0: direct postgres is only needed
      # for host-mode migrations (`pnpm db:migrate`). An unqualified mapping
      # exposes Postgres with dev credentials to the entire network on server
      # deployments (issue #454). Loopback-only keeps it reachable from the
      # host machine without that exposure.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432" # direct postgres for pnpm db:migrate from host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── PgBouncer (connection pooler) ─────────────────────────────────────────
  # Transaction mode is required so SET LOCAL app.tenant_id scoping works
  # correctly — session mode would let the setting leak across pooled connections.
  pgbouncer:
    container_name: ow-pgbouncer
    # pinned 2026-07-24 — this was :latest's resolved digest at pin time, no named
    # version tag published upstream for this image; bump deliberately, in its own commit
    image: edoburu/pgbouncer@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: platform
      DB_USER: app_user
      DB_PASSWORD: app_user_dev_password
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
      SERVER_TLS_SSLMODE: disable
    ports:
      # Loopback-only (127.0.0.1), not 0.0.0.0: host-mode app/tests connect
      # via PgBouncer. Unqualified mapping would expose PgBouncer to the network.
      - "127.0.0.1:${PGBOUNCER_HOST_PORT:-6432}:5432" # App connects here, not 5432
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U app_user || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── OpenBao (secrets manager) ──────────────────────────────────────────────
  openbao:
    container_name: ow-secrets
    # pinned 2026-07-24 — v2.6.1 (both openbao lines MUST stay on the same version)
    image: openbao/openbao@sha256:5b2486ab0fb90bbc788cc345b0a08616dfb375873ee8be5df3a2fd4d378a67e0
    restart: unless-stopped
    command: server -dev -dev-root-token-id=dev-root-token
    environment:
      BAO_DEV_ROOT_TOKEN_ID: dev-root-token
      BAO_ADDR: http://0.0.0.0:8200
      BAO_LOG_LEVEL: warn
    ports:
      # Loopback-only (127.0.0.1), not 0.0.0.0: openbao runs in dev mode with
      # a hardcoded static root token (BAO_DEV_ROOT_TOKEN_ID=dev-root-token).
      # An unqualified mapping exposes the platform secrets manager to the entire
      # network (issue #455). Loopback-only satisfies host-mode tooling while
      # restricting network exposure.
      - "127.0.0.1:${OPENBAO_HOST_PORT:-8200}:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  openbao-init:
    container_name: ow-secrets-init
    # pinned 2026-07-24 — v2.6.1 (both openbao lines MUST stay on the same version)
    image: openbao/openbao@sha256:5b2486ab0fb90bbc788cc345b0a08616dfb375873ee8be5df3a2fd4d378a67e0
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: dev-root-token
    entrypoint: >
      /bin/sh -c "
        bao secrets enable transit 2>/dev/null || true &&
        bao write -f transit/keys/platform-credentials derived=true &&
        echo 'OpenBao Transit key created with derivation enabled'
      "
    restart: "no"

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    container_name: ow-cache
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Loopback-only (127.0.0.1), not 0.0.0.0: redis has no auth configured
      # (no `requirepass`/ACL) — an unqualified host mapping would expose it,
      # unauthenticated, to the whole network on a server deployment (this
      # compose file is "the standard way to run the app, in dev and on
      # servers alike" per CLAUDE.md). Loopback-only still satisfies the
      # actual need (host-mode `pnpm test`/`pnpm dev` reaching in from the
      # same machine) without that exposure.
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    # ow-backend/worker reach redis over the Docker network by service name —
    # this host mapping is only for host-mode `pnpm test`/`pnpm dev` reaching
    # in (same reason postgres has POSTGRES_HOST_PORT). The default still
    # binds host port 6379, so a host already running another redis container
    # on that port (a second OpenWind checkout, an unrelated project) will
    # fail to start ow-cache — set REDIS_HOST_PORT to a free port to resolve
    # that, same as POSTGRES_HOST_PORT (issue #450) — see
    # .env.example's own note on that var for the override caveat.
    command: >
      redis-server
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save 60 1000
        --loglevel notice
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── ClamAV (antivirus scanning for uploaded files) ────────────────────────
  # apps/worker/src/av-scan.ts streams each upload here over the INSTREAM TCP
  # protocol before marking scanStatus "clean". Without this service the
  # scan queue retries 5x then gives up (scanStatus stuck at "pending", then
  # "scan_failed") — files are never downloadable.
  # First boot downloads the virus signature database (freshclam) — can take
  # a few minutes; start_period below gives it room before healthcheck fails.
  clamav:
    container_name: ow-clamav
    # pinned 2026-08-06 — digest resolved from the "stable" tag published
    # upstream for this image; bump deliberately, in its own commit (the
    # freshclam virus-database update inside the container still runs on its
    # own schedule regardless of this pin — this only fixes the image build).
    image: clamav/clamav@sha256:d06c1d6a451d616e1dd79b42f44c8c8c291bba9cf4e75ebc4d0e43c1c6dd87bb
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  # ── MinIO (local S3) — NOT IN USE. packages/files stores on local disk now
  # (see docs/specs/local-disk-file-storage.md). Kept here commented out only
  # for reference / a possible future return to object storage.
  # minio:
  #   container_name: ow-storage
  #   # pinned 2026-07-24 — this was :latest's resolved digest at pin time, no named
  #   # version tag identified for it in the first 500 published tags; bump deliberately
  #   image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
  #   restart: unless-stopped
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: platform_access_key
  #     MINIO_ROOT_PASSWORD: platform_secret_key_dev_only
  #     MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio_data:/data
  #   healthcheck:
  #     test: ["CMD", "mc", "ready", "local"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #
  # minio-init:
  #   container_name: ow-storage-init
  #   # pinned 2026-07-24 — this was :latest's resolved digest at pin time, no named
  #   # version tag identified for it in the first 500 published tags; bump deliberately
  #   image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
  #   depends_on:
  #     minio:
  #       condition: service_healthy
  #   entrypoint: >
  #     /bin/sh -c "
  #       mc alias set local http://minio:9000 platform_access_key platform_secret_key_dev_only &&
  #       mc mb --ignore-existing local/platform-files &&
  #       mc anonymous set none local/platform-files &&
  #       echo 'MinIO bucket initialized'
  #     "
  #   restart: "no"

  # ── Novu (Notifications) — profile:notifications ───────────────────────────
  # Not started by default. Run with: docker compose --profile notifications up -d
  novu-api:
    container_name: ow-notify-api
    profiles: [notifications]
    # pinned 2026-07-24 — :latest's resolved digest, built 2026-07-08. NOTE: novu-web's
    # :latest was last rebuilt 2025-03-21 — the three novu-* images are NOT on a matched
    # release line upstream; this pin preserves exactly what was running, not a synced set
    image: ghcr.io/novuhq/novu/api@sha256:d9550e949cf469a3124c6859844863c15881c512fcd2cf5ea2147f8b339fb4e7
    restart: unless-stopped
    environment:
      NODE_ENV: local
      API_ROOT_URL: http://localhost:3010
      FRONT_BASE_URL: http://localhost:4200
      MONGO_URL: mongodb://novu-mongo:27017/novu
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: novu_dev_jwt_secret_change_in_prod
      STORE_ENCRYPTION_KEY: "=<pAs&zYAHF3kRZr"
    ports:
      - "3010:3000"
    depends_on:
      - novu-mongo
      - redis

  novu-worker:
    container_name: ow-notify-worker
    profiles: [notifications]
    # pinned 2026-07-24 — :latest's resolved digest, built 2026-07-08 (see novu-api's note
    # on the novu-*/web version drift)
    image: ghcr.io/novuhq/novu/worker@sha256:83296878d1b633ca5c9a4e39b10283fa8e2c4d5d341c11847ffd1e4a3897f3b0
    restart: unless-stopped
    environment:
      NODE_ENV: local
      MONGO_URL: mongodb://novu-mongo:27017/novu
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: novu_dev_jwt_secret_change_in_prod
      STORE_ENCRYPTION_KEY: "=<pAs&zYAHF3kRZr"
    depends_on:
      - novu-mongo
      - redis

  novu-web:
    container_name: ow-notify-web
    profiles: [notifications]
    # pinned 2026-07-24 — :latest's resolved digest, built 2025-03-21 (see novu-api's note
    # on the novu-*/web version drift — this one is over a year older than api/worker)
    image: ghcr.io/novuhq/novu/web@sha256:f454df7c8d2101a3d600675d75311cf449040db0edc15fbc069cd16d4cb0a993
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:3010
    ports:
      - "4200:4200"

  novu-mongo:
    container_name: ow-notify-db
    profiles: [notifications]
    image: mongo:7
    restart: unless-stopped
    volumes:
      - novu_mongo_data:/data/db

  # ── Mailhog (local email trap) — profile:tools ─────────────────────────────
  mailhog:
    container_name: ow-mailhog
    profiles: [tools, observability]
    # pinned 2026-07-24 — this project has never published a tag besides :latest,
    # so this digest is the only way to freeze it; bump deliberately, in its own commit
    image: mailhog/mailhog@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MH_STORAGE: maildir
      MH_MAILDIR_PATH: /mailhog-data
    volumes:
      - mailhog_data:/mailhog-data

  # ── Bull Board (queue dashboard) — profile:tools ───────────────────────────
  bullboard:
    container_name: ow-bullboard
    profiles: [tools]
    # pinned 2026-07-24 — this project has never published a tag besides :latest,
    # so this digest is the only way to freeze it; bump deliberately, in its own commit
    image: deadly0/bull-board@sha256:afd615426192c7d43d6320aea7d8910835170c8b43e9b755b6c416d38946be93
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USE_TLS: "false"
    ports:
      - "3099:3000"
    depends_on:
      - redis

  # ── API (Hono / Node) ─────────────────────────────────────────────────────
  # Runs with tsx so source changes are picked up on container restart.
  # env_file provides all secrets; environment overrides service URLs so
  # container-to-container networking works (pgbouncer:5432 not localhost:6432).
  ow-backend:
    container_name: ow-backend
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # host-gateway explicitly restores the host.docker.internal mapping that
    # Docker Desktop normally provides automatically. Observed live: after a
    # Docker Desktop crash/restart, that automatic mapping can go missing —
    # DNS lookups from inside the container fail with ENOTFOUND — even though
    # every container is healthy and Zitadel itself never went down. This is a
    # host-gateway request, not a Zitadel restart, and does not change which
    # URL or Host header the app sends — only that the name resolves again.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://app_user:app_user_dev_password@pgbouncer:5432/platform
      REDIS_URL: redis://redis:6379
      # Zitadel connection — if ZITADEL_URL is set in .env.local (production / custom deploy)
      # the backend uses that public URL for JWKS and introspection.
      # Without ZITADEL_URL the default falls back to the shared Docker network name
      # (http://zitadel:8080) so local dev continues to work with no extra config.
      ZITADEL_JWKS_URL: ${ZITADEL_URL:-http://zitadel:8080}/oauth/v2/keys
      ZITADEL_INTROSPECTION_URL: ${ZITADEL_URL:-http://zitadel:8080}/oauth/v2/introspect
      OPENBAO_ADDR: http://openbao:8200
      # Reporting (track 3G) — read from .env like every other setting here, not
      # .env.local; this repo's config discipline is .env locally and the same
      # variable names again at deploy time, never a second config file.
      SUPERSET_SITE_URL: ${SUPERSET_SITE_URL:-http://localhost:8088}
      SUPERSET_INTERNAL_URL: ${SUPERSET_INTERNAL_URL:-http://superset:8088}
      SUPERSET_DASHBOARD_TENANT_SLUG: ${SUPERSET_DASHBOARD_TENANT_SLUG:-openwind-tenant-overview}
      SUPERSET_DASHBOARD_USER_SLUG: ${SUPERSET_DASHBOARD_USER_SLUG:-openwind-my-performance}
      SUPERSET_SERVICE_ACCOUNT_USER: ${SUPERSET_SERVICE_ACCOUNT_USER:-service_account}
      SUPERSET_SERVICE_ACCOUNT_PASSWORD: ${SUPERSET_SERVICE_ACCOUNT_PASSWORD:?SUPERSET_SERVICE_ACCOUNT_PASSWORD is required}
      # Local-disk file storage (see docs/specs/local-disk-file-storage.md) —
      # in-container path only; the host-side bind-mount source is
      # FILES_STORAGE_PATH_HOST below, set from .env.
      FILES_STORAGE_PATH: /data/files
    ports:
      # Loopback-only, same pattern as postgres/pgbouncer/redis/openbao below —
      # never 0.0.0.0. This exists so a reverse proxy running ON THE HOST (nginx/
      # Caddy/Traefik) can forward /api/v1 (third-party API) and /ws (notification
      # push) to the backend without the container itself being reachable from
      # outside the box. In-cluster traffic (ow-frontend's Vite proxy, ow-worker,
      # etc.) still uses the ow-backend:3000 service name over the Docker network —
      # this port is for the host-level reverse proxy only.
      - "127.0.0.1:${API_HOST_PORT:-3002}:3000"
    # The host's primary DNS resolver has been observed timing out
    # intermittently on external lookups (e.g. the ZITADEL_URL host), which
    # Docker's embedded DNS (127.0.0.11) inherits and fails faster on than
    # the OS does — surfaces as JWKSTimeout -> spurious 401s after login.
    # Keep Docker's embedded resolver first (it resolves sibling container
    # names like redis/postgres/pgbouncer) and fall back to public resolvers
    # only for external lookups — listing only 1.1.1.1/8.8.8.8 here broke
    # in-network service name resolution entirely.
    dns:
      - 127.0.0.11
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    networks:
      - default
      - openwind_zitadel
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy
    volumes:
      - "${FILES_STORAGE_PATH_HOST:-../openwind-files}:/data/files"

  # ── Worker (BullMQ background jobs — outbox poller, automation, SLA,
  # notifications, file cleanup, AV scan) ─────────────────────────────────────
  # Separate deployable from ow-backend by design (CLAUDE.md repository layout):
  # apps/api serves HTTP + the notification websocket's live push, but the
  # actual outbox polling / automation execution / notification-row creation
  # that feeds that push runs here. Without this service, BullMQ jobs queue up
  # but are never consumed — notifications silently never get created.
  ow-worker:
    container_name: ow-worker
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    # Same host.docker.internal restoration as ow-backend above, needed here
    # for the identical ZITADEL_JWKS_URL/ZITADEL_INTROSPECTION_URL usage below.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://app_user:app_user_dev_password@pgbouncer:5432/platform
      MIGRATION_DATABASE_URL: postgresql://migration_user:migration_user_dev_password@postgres:5432/platform
      REDIS_URL: redis://redis:6379
      ZITADEL_JWKS_URL: ${ZITADEL_URL:-http://zitadel:8080}/oauth/v2/keys
      ZITADEL_INTROSPECTION_URL: ${ZITADEL_URL:-http://zitadel:8080}/oauth/v2/introspect
      OPENBAO_ADDR: http://openbao:8200
      # Local-disk file storage (see docs/specs/local-disk-file-storage.md) —
      # must be the same in-container path as ow-backend so the AV scan
      # worker reads bytes from the same place the API wrote them.
      FILES_STORAGE_PATH: /data/files
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    dns:
      - 127.0.0.11
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    networks:
      - default
      - openwind_zitadel
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - "${FILES_STORAGE_PATH_HOST:-../openwind-files}:/data/files"

  # ── Admin UI (React + Refine) ──────────────────────────────────────────────
  # Dev mode: Vite dev server with HMR. Source files are mounted as volumes so
  # any change on the host is picked up instantly — no rebuild needed.
  ow-frontend:
    container_name: ow-frontend
    build:
      context: .
      dockerfile: apps/admin-ui/Dockerfile.dev
    ports:
      - "${ADMIN_UI_HOST_PORT:-3001}:3001" # Vite dev server → http://localhost:3001
    environment:
      # admin-ui's API_URL is always the relative "/api" — this makes Vite's dev
      # server proxy it to the backend over the Docker network. Without this,
      # every /api/* request falls through to Vite's SPA fallback and silently
      # returns index.html instead of JSON.
      VITE_API_PROXY_TARGET: http://ow-backend:3000
    volumes:
      - ./apps/admin-ui/src:/app/apps/admin-ui/src
      - ./apps/admin-ui/index.html:/app/apps/admin-ui/index.html
      - ./apps/admin-ui/vite.config.ts:/app/apps/admin-ui/vite.config.ts
      - ./.env.local:/app/.env.local:ro
    restart: unless-stopped

  # ── Bootstrap (one-time setup) — profile:bootstrap ───────────────────────────
  # Runs migrations, seeds the DB, configures Zitadel, and creates demo users.
  # Designed to be idempotent — safe to re-run.
  #
  # Usage:
  #   docker compose --profile bootstrap run --rm bootstrap
  bootstrap:
    container_name: ow-bootstrap
    profiles: [bootstrap]
    build:
      context: .
      dockerfile: Dockerfile.bootstrap
    env_file:
      - path: .env.local
        required: false
    environment:
      RUNNING_IN_DOCKER: "true"
      DATABASE_URL: postgres://app_user:app_user_dev_password@pgbouncer:5432/platform
      MIGRATION_DATABASE_URL: postgres://migration_user:migration_user_dev_password@postgres:5432/platform
      REDIS_URL: redis://redis:6379
      ZITADEL_EXTERNAL_DOMAIN: "${ZITADEL_EXTERNAL_DOMAIN:-localhost}"
      ZITADEL_HOST_PORT: "${ZITADEL_HOST_PORT:-8080}"
      ZITADEL_EXTERNALSECURE: "${ZITADEL_EXTERNALSECURE:-false}"
      # APP_URL is the public base URL of the OpenWind UI (e.g. https://openwind.rokkalabs.com).
      # Bootstrap uses it to register the correct OIDC redirect URIs in Zitadel.
      # Leave empty for local dev — localhost:3001 redirect URIs are always registered.
      APP_URL: "${APP_URL:-}"
      # Passed in by setup.bat/setup.sh via: docker compose run -e ZITADEL_SETUP_PAT=<token>
      # Used on first boot only — after bootstrap saves ZITADEL_KEY_JSON this is no longer needed.
      ZITADEL_SETUP_PAT: "${ZITADEL_SETUP_PAT:-}"
    volumes:
      - ./.env.local:/app/.env.local
    networks:
      - default
      - openwind_zitadel
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: "no"

  # ── OpenTelemetry Collector — profile:observability ──────────────────────
  otel-collector:
    container_name: ow-otel-collector
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.108.0
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/observability/otel-collector.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC receiver (loopback only)
      - "127.0.0.1:4318:4318" # OTLP HTTP receiver (loopback only)

  # ── Prometheus — profile:observability ────────────────────────────────────
  prometheus:
    container_name: ow-prometheus
    profiles: [observability]
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    depends_on:
      - ow-backend
      - ow-worker

  # ── Grafana — profile:observability ───────────────────────────────────────
  grafana:
    container_name: ow-grafana
    profiles: [observability]
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT:-3005}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}

  # ── Alertmanager — profile:observability ──────────────────────────────────
  alertmanager:
    container_name: ow-alertmanager
    profiles: [observability]
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./docker/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_HOST_PORT:-9093}:9093"

  # ── Superset (Reporting, track 3G) — profile:reporting ─────────────────────
  # Started by default: .env.example ships COMPOSE_PROFILES=reporting, so a
  # fresh clone comes up with reporting working. The profile is still here so a
  # deployment that does not want reporting can drop it from COMPOSE_PROFILES
  # without editing this file (spec R16, amended 2026-09-11).
  #
  # Two things this service must never be, per the reporting spec's §S:
  #  - reachable off-box (loopback mapping below, same as postgres/redis/openbao)
  #  - running on a default signing key (@platform/config refuses to start in
  #    production if SUPERSET_SECRET_KEY is still the dev value — a known key
  #    forges an admin session, the CVE-2023-27524 mechanism)
  superset:
    container_name: ow-superset
    profiles: [reporting]
    # re-pinned 2026-09-17 to 6.1.0 — 6.0.0 shipped setThemeMode/urlParams.
    # themeMode as API surface with no working implementation for embedded/
    # guest dashboards (confirmed live: called with no error, no visual
    # effect, and its ThemeRestApi permission does not even exist in that
    # build). 6.1.0's changelog lists setThemeMode as newly functional
    # (#36125); verified no CVEs and no breaking change to RLS/guest-token/
    # DB_CONNECTION_MUTATOR between 6.0.x and 6.1.0. Re-pin cadence is
    # tracked in the spec (T6): an unrefreshed pin freezes today's CVE
    # exposure.
    # Built, not pulled: the upstream image carries no database driver.
    # See docker/superset/Dockerfile.
    build:
      context: .
      dockerfile: docker/superset/Dockerfile
    image: openwind-superset:6.1.0
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
    # Deployment secrets, the same channel api/worker/bootstrap already use.
    # The OAuth client id and secret are issued per Zitadel instance and belong
    # here rather than in .env, which this repo commits.
    env_file:
      - path: .env.local
        required: false
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required — see .env.example}
      SUPERSET_GUEST_TOKEN_SECRET: ${SUPERSET_GUEST_TOKEN_SECRET:?SUPERSET_GUEST_TOKEN_SECRET is required — see .env.example}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      # The shipped image defaults to 1 worker / 60s timeout (see its own
      # run-server.sh). Verified live: a single worker under normal browser
      # retry traffic hit WORKER TIMEOUT -> SIGKILL -> respawn, which is
      # indistinguishable from the container being down for whoever is
      # loading the page at that moment. Raised for local-dev resilience;
      # revisit alongside the real capacity number T17 is meant to set.
      SERVER_WORKER_AMOUNT: ${SUPERSET_WORKER_AMOUNT:-2}
      GUNICORN_TIMEOUT: ${SUPERSET_GUNICORN_TIMEOUT:-120}
      # Superset's OWN metadata database (dashboards, charts, roles) — not the
      # platform database, and not the reporting credential. Superset creates
      # these tables itself, which needs DDL; analytics_user is read-only by
      # design, so pointing this at the platform database fails at `db upgrade`
      # with "permission denied for schema public". The reporting connection is
      # registered separately, read-only, by bootstrap.py.
      #
      # Direct to postgres, not pgbouncer: pgbouncer is configured with a single
      # hardcoded user (DB_USER: app_user), so no other role can authenticate
      # through it as things stand. migration_user connects directly for the
      # same reason. This matters for capacity — Superset opens a fresh
      # connection per query (NullPool), so the spec's 200-concurrent target
      # (R11/T17) lands on postgres directly until pgbouncer supports more than
      # one user. Tracked on T17, not assumed to already work.
      DATABASE_URL: postgresql+psycopg2://superset_user:${SUPERSET_DB_PASSWORD:-superset_user_dev_password}@postgres:5432/superset
      REDIS_URL: redis://redis:6379/2
      # Stage 2 (users write their own queries). Superset switches to Zitadel
      # login only when a client id is present - unset leaves it on database
      # login, with the embedded path as the only way in.
      # SUPERSET_OAUTH_CLIENT_ID and SUPERSET_OAUTH_CLIENT_SECRET are NOT listed
      # here on purpose. They are issued per Zitadel instance by
      # scripts/setup-superset-oauth.ts, so they are deployment secrets, not
      # defaults — and `environment:` takes precedence over `env_file:`, so
      # naming them here with a `${VAR:-}` fallback would override the real
      # value with an empty string whenever .env did not carry it.
      #
      # They arrive through the env_file above instead, which is how api,
      # worker and bootstrap already take their secrets. That keeps them out of
      # .env, which this repo commits on purpose as upstream-safe defaults.
      # Two URLs on purpose: the browser is redirected to the first, while the
      # container fetches tokens and keys over the Docker network with the
      # second. One value cannot serve both.
      SUPERSET_OAUTH_ISSUER: ${SUPERSET_OAUTH_ISSUER:-http://localhost:8080}
      # SUPERSET_OAUTH_INTERNAL_ISSUER is also not listed here: it names one
      # Zitadel instance's own domain, so it differs per install and comes from
      # .env.local via env_file. Unset, Superset uses SUPERSET_OAUTH_ISSUER.
      # Setup: docs/specs/superset-standalone-with-zitadel.md, "Local setup".
      SUPERSET_SESSION_MAX_MINUTES: ${SUPERSET_SESSION_MAX_MINUTES:-480}
      SUPERSET_REPORTING_DB_NAME: ${SUPERSET_REPORTING_DB_NAME:-OpenWind Platform}
    volumes:
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    ports:
      # Loopback-only, for the same reason as postgres/redis/openbao above:
      # Superset holds a database credential and (until SQL Lab is disabled)
      # a query surface over platform data. The browser reaches it from this
      # machine — SUPERSET_SITE_URL — so loopback still serves the real need.
      - "127.0.0.1:${SUPERSET_HOST_PORT:-8088}:8088"
    networks:
      - default
      # Stage 2 only: Superset completes the OAuth code exchange from its own
      # process, so it needs a route to Zitadel that does not go through the
      # browser. Without this the container cannot resolve the name at all and
      # every login fails at the discovery fetch, before any credential is
      # entered. Same network the API and worker already join.
      - openwind_zitadel
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # One-shot: database migration, admin user, then provisioning. Exits 0 when
  # done; the superset service waits on that via service_completed_successfully
  # so the app never serves an unmigrated metadata database.
  superset-init:
    container_name: ow-superset-init
    profiles: [reporting]
    # Built, not pulled: the upstream image carries no database driver.
    # See docker/superset/Dockerfile.
    build:
      context: .
      dockerfile: docker/superset/Dockerfile
    image: openwind-superset:6.1.0
    depends_on:
      postgres:
        condition: service_healthy
    # Same channel as the server above. Provisioning needs the OAuth client id
    # to decide whether SQL Lab is exposed on the reporting connection, and it
    # must read the same value the server does or a restart flips it back.
    env_file:
      - path: .env.local
        required: false
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required — see .env.example}
      SUPERSET_GUEST_TOKEN_SECRET: ${SUPERSET_GUEST_TOKEN_SECRET:?SUPERSET_GUEST_TOKEN_SECRET is required — see .env.example}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD is required — see .env.example}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      # The reporting data connection: read-only, separate from the metadata
      # credential above, and pointed at the platform database.
      # The backend-only account the API mints passes with. Provisioned with a
      # single Superset permission, never Admin.
      SUPERSET_SERVICE_ACCOUNT_USER: ${SUPERSET_SERVICE_ACCOUNT_USER:-service_account}
      SUPERSET_SERVICE_ACCOUNT_PASSWORD: ${SUPERSET_SERVICE_ACCOUNT_PASSWORD:?SUPERSET_SERVICE_ACCOUNT_PASSWORD is required — see .env.example}
      SUPERSET_REPORTING_DB_URI: postgresql+psycopg2://analytics_user:${ANALYTICS_USER_PASSWORD:-analytics_user_dev_password}@postgres:5432/platform
      # Dashboards are addressed by slug, never by UUID — the embedded UUID is
      # generated by Superset and resolved at runtime (spec R17).
      SUPERSET_DASHBOARD_TENANT_SLUG: ${SUPERSET_DASHBOARD_TENANT_SLUG:-openwind-tenant-overview}
      SUPERSET_DASHBOARD_USER_SLUG: ${SUPERSET_DASHBOARD_USER_SLUG:-openwind-my-performance}
      # The only origin permitted to frame an embedded dashboard.
      SUPERSET_EMBED_ORIGIN: ${SUPERSET_EMBED_ORIGIN:-http://localhost:3001}
      # Superset's OWN metadata database (dashboards, charts, roles) — not the
      # platform database, and not the reporting credential. Superset creates
      # these tables itself, which needs DDL; analytics_user is read-only by
      # design, so pointing this at the platform database fails at `db upgrade`
      # with "permission denied for schema public". The reporting connection is
      # registered separately, read-only, by bootstrap.py.
      #
      # Direct to postgres, not pgbouncer: pgbouncer is configured with a single
      # hardcoded user (DB_USER: app_user), so no other role can authenticate
      # through it as things stand. migration_user connects directly for the
      # same reason. This matters for capacity — Superset opens a fresh
      # connection per query (NullPool), so the spec's 200-concurrent target
      # (R11/T17) lands on postgres directly until pgbouncer supports more than
      # one user. Tracked on T17, not assumed to already work.
      DATABASE_URL: postgresql+psycopg2://superset_user:${SUPERSET_DB_PASSWORD:-superset_user_dev_password}@postgres:5432/superset
      REDIS_URL: redis://redis:6379/2
      # SUPERSET_OAUTH_CLIENT_ID is deliberately absent here, as it is on the
      # server above: it arrives through env_file. Provisioning needs the same
      # value the server sees — it decides whether the reporting connection is
      # exposed in SQL Lab, and a mismatch between the two makes a restart
      # silently flip it back. Listing it here with a `${VAR:-}` fallback would
      # do exactly that, because `environment:` overrides `env_file:`.
    volumes:
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./docker/superset/init.sh:/app/init.sh:ro
      - ./docker/superset/bootstrap.py:/app/bootstrap.py:ro
      - ./docker/superset/tiles.yaml:/app/tiles.yaml:ro
    entrypoint: ["/bin/bash", "/app/init.sh"]
    networks:
      - default

# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  clamav_data:
  novu_mongo_data:
  mailhog_data:
  prometheus_data:
  grafana_data:
  # minio_data:  # unused — minio service is commented out, see above
networks:
  openwind_zitadel:
    external: true # created by the zitadel compose project (../zitadel/)
    name: openwind_zitadel
