packages:
  - "apps/*"
  - "packages/*"
  - "modules/*"

allowBuilds:
  esbuild: true
  msgpackr-extract: true

# Moved from package.json's "pnpm.overrides" field for pnpm 11 (that field is no longer
# read; see CLAUDE.md's Maintenance notes for why the esbuild pin must not be removed).
overrides:
  typescript: "^5.5.0"
  esbuild: ">=0.28.1"
  hono: ">=4.12.25"
  # GHSA-3jxr-9vmj-r5cp + GHSA-52cp-r559-cp3m: brace-expansion DoS
  "brace-expansion@1": "1.1.16"
  "brace-expansion@2": "2.1.2"
  "brace-expansion@5": "5.0.7"
  # js-yaml quadratic CPU via merge-key chains
  "js-yaml@4": "4.3.0"
