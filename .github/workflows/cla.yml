name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/TinyPhi/OpenWind/blob/legal/cla-draft/CLA.md"
          branch: "cla-signatures"
          allowlist: dependabot*
          custom-notsigned-prcomment: |
            Thanks for this contribution! Before it can be merged, please read and sign the
            [Contributor Assignment Agreement](https://github.com/TinyPhi/OpenWind/blob/legal/cla-draft/CLA.md)
            by replying to this comment with the sentence below.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. ✅"
