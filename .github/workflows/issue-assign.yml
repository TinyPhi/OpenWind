name: Issue Assignment

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  assign:
    name: Assign or Unassign
    # Only run on open issues (not pull requests) and ignore bot comments
    if: |
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      !github.event.comment.user.bot
    runs-on: ubuntu-latest
    steps:
      - name: Process assignment command
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment;
            const issue = context.payload.issue;
            const body = (comment.body || '').trim();
            const commenter = comment.user.login;
            const authorAssociation = comment.author_association;
            const issueNumber = issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const isMaintainer = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(authorAssociation);

            // Match assignment commands: /assign, /take, .take
            const assignMatch = body.match(/(?:^|\s)(?:\/assign|\/take|\.take)(?:[^\S\r\n]+([^\r\n]*))?/i);
            // Match unassignment commands: /unassign, /drop, .drop
            const unassignMatch = body.match(/(?:^|\s)(?:\/unassign|\/drop|\.drop)(?:[^\S\r\n]+([^\r\n]*))?/i);

            if (!assignMatch && !unassignMatch) {
              return;
            }

            const currentAssignees = (issue.assignees || []).map(a => a.login);

            // Helper to parse mentioned @usernames
            function parseMentions(rawArgs) {
              if (!rawArgs) return [];
              const matches = rawArgs.match(/@([a-zA-Z0-9-]+)/g);
              if (!matches) return [];
              return [...new Set(matches.map(m => m.replace(/^@/, '')))];
            }

            // React to comment
            async function addReaction(content) {
              try {
                await github.rest.reactions.createForIssueComment({
                  owner,
                  repo,
                  comment_id: comment.id,
                  content,
                });
              } catch (err) {
                core.warning(`Failed to add reaction: ${err.message}`);
              }
            }

            // Post reply comment
            async function postComment(text) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: text,
              });
            }

            if (assignMatch) {
              const mentionedUsers = parseMentions(assignMatch[1]);

              if (mentionedUsers.length > 0) {
                // Assigning specific users
                if (!isMaintainer) {
                  await addReaction('confused');
                  await postComment(`@${commenter} Only maintainers can assign other users. Use \`/assign\` or \`/take\` to self-assign.`);
                  return;
                }

                const usersToAdd = mentionedUsers.filter(u => !currentAssignees.includes(u));
                if (usersToAdd.length === 0) {
                  await addReaction('eyes');
                  return;
                }

                try {
                  await github.rest.issues.addAssignees({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    assignees: usersToAdd,
                  });
                  await addReaction('rocket');
                } catch (error) {
                  await addReaction('confused');
                  await postComment(`Could not assign @${usersToAdd.join(', @')}: ${error.message}.\n\n*Note: On public repositories, users must either be a repository collaborator or have commented on this issue first to be assignable.*`);
                }
              } else {
                // Self-assignment
                if (currentAssignees.includes(commenter)) {
                  await addReaction('eyes');
                  return;
                }

                // If issue is already assigned to someone else and commenter is not a maintainer, prevent taking it
                if (currentAssignees.length > 0 && !isMaintainer) {
                  await addReaction('confused');
                  await postComment(`@${commenter} This issue is already assigned to @${currentAssignees.join(', @')}. Please coordinate with them if you'd like to collaborate!`);
                  return;
                }

                try {
                  await github.rest.issues.addAssignees({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    assignees: [commenter],
                  });
                  await addReaction('rocket');
                } catch (error) {
                  await addReaction('confused');
                  core.setFailed(`Failed to self-assign issue: ${error.message}`);
                }
              }
            } else if (unassignMatch) {
              const mentionedUsers = parseMentions(unassignMatch[1]);

              if (mentionedUsers.length > 0) {
                // Unassigning specific users
                if (!isMaintainer) {
                  await addReaction('confused');
                  await postComment(`@${commenter} Only maintainers can unassign other users. Use \`/unassign\` or \`/drop\` to unassign yourself.`);
                  return;
                }

                const usersToRemove = mentionedUsers.filter(u => currentAssignees.includes(u));
                if (usersToRemove.length === 0) {
                  await addReaction('eyes');
                  return;
                }

                try {
                  await github.rest.issues.removeAssignees({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    assignees: usersToRemove,
                  });
                  await addReaction('+1');
                } catch (error) {
                  core.setFailed(`Failed to unassign users: ${error.message}`);
                }
              } else {
                // Self-unassignment
                if (!currentAssignees.includes(commenter)) {
                  await addReaction('eyes');
                  return;
                }

                try {
                  await github.rest.issues.removeAssignees({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    assignees: [commenter],
                  });
                  await addReaction('+1');
                } catch (error) {
                  core.setFailed(`Failed to self-unassign issue: ${error.message}`);
                }
              }
            }
