name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # CodeQL backstop — non-code PRs (docs/config-only) skip the `security` job below,
    # so this keeps weekly coverage from lapsing on quiet weeks.
    - cron: "0 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ── 0. Change detection ─────────────────────────────────────────────────────
  # Job-level `if:` (not top-level paths-ignore) so required status checks still
  # report "skipped" instead of leaving PRs stuck on a check that never ran.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    outputs:
      code: ${{ steps.filter.outputs.code }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.sql'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '**/tsconfig*.json'
              - 'apps/**/Dockerfile'
            db:
              - 'packages/db/**'
              - 'packages/entity-engine/**'
              - 'packages/workflow-engine/**'
              - 'packages/automation-engine/**'
              - 'apps/**'
              - 'tests/isolation/**'

  # ── 1. Lint and type-check ─────────────────────────────────────────────────
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for commitlint

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: |
          pnpm commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

      - name: Determine turbo affected-filter base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TURBO_FILTER=...[origin/${{ github.event.pull_request.base.ref }}]" >> "$GITHUB_ENV"
          else
            echo "TURBO_FILTER=...[HEAD^1]" >> "$GITHUB_ENV"
          fi

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint --filter="$TURBO_FILTER"

      - name: Type check
        run: pnpm typecheck --filter="$TURBO_FILTER"

      - name: Build all packages
        run: pnpm build --filter="$TURBO_FILTER"

  # ── 2. Unit and integration tests ─────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    if: github.event.pull_request.draft != true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform_test_password
          POSTGRES_DB: platform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://platform:platform_test_password@localhost:5432/platform_test
      DATABASE_MIGRATION_URL: postgresql://platform:platform_test_password@localhost:5432/platform_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      OPENBAO_ADDR: http://localhost:8200
      OPENBAO_TRANSIT_KEY: platform-test
      OPENBAO_TOKEN: dev-root-token
      ANTHROPIC_API_KEY: test_key_not_used_in_tests
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: test-bucket
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      ZITADEL_ISSUER: http://localhost:8080
      ZITADEL_AUDIENCE: platform-api
      NOVU_API_KEY: test_key
      NOVU_API_URL: http://localhost:3010
      APP_URL: https://platform.example.com

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to resolve HEAD^1 / origin/<base> for the turbo affected-filter

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine turbo affected-filter base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TURBO_FILTER=...[origin/${{ github.event.pull_request.base.ref }}]" >> "$GITHUB_ENV"
          else
            echo "TURBO_FILTER=...[HEAD^1]" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: pnpm build --filter="$TURBO_FILTER"

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_MIGRATION_URL }}

      - name: Run unit + integration tests
        run: pnpm test --filter="$TURBO_FILTER"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── 3. Tenant isolation tests (mandatory on db/ changes) ──────────────────
  isolation-tests:
    name: Tenant isolation
    runs-on: ubuntu-latest
    needs: [quality, changes]
    # Always run on push (post-merge safety net); on PRs, only when db-relevant
    # paths changed — this suite is the heaviest job after CodeQL and most PRs
    # (UI-only, docs-only, config-only) never touch these paths. `always()` plus
    # an explicit quality-success check replaces the implicit needs-gating so a
    # `changes` job failure fails OPEN (runs the suite) instead of silently
    # skipping a tenant-isolation check — silent-skip-on-tooling-hiccup is not
    # an acceptable failure mode for this particular suite.
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      github.event.pull_request.draft != true &&
      (github.event_name == 'push' || needs.changes.result == 'failure' || needs.changes.outputs.db == 'true')

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform_test_password
          POSTGRES_DB: platform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://platform:platform_test_password@localhost:5432/platform_test
      DATABASE_MIGRATION_URL: postgresql://platform:platform_test_password@localhost:5432/platform_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      APP_URL: https://platform.example.com

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to resolve HEAD^1 / origin/<base> for the turbo affected-filter

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine turbo affected-filter base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TURBO_FILTER=...[origin/${{ github.event.pull_request.base.ref }}]" >> "$GITHUB_ENV"
          else
            echo "TURBO_FILTER=...[HEAD^1]" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: pnpm build --filter="$TURBO_FILTER"

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_MIGRATION_URL }}

      - name: Run tenant isolation tests
        run: pnpm test:isolation --filter="$TURBO_FILTER"

  # ── 4. Security scan ──────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      security-events: write
    # CodeQL is the slowest job in this workflow. Skip it for PRs that touch no
    # code (docs/.claude/-only); still run on every push and on the weekly
    # schedule so coverage doesn't lapse for quiet weeks. `always()` is required
    # here: `changes` intentionally skips itself on the schedule trigger, and
    # without always() the default needs-gating would make this job inherit
    # that skip — silently defeating the weekly backstop this job exists for.
    if: >-
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'push' ||
       needs.changes.result == 'failure' || needs.changes.outputs.code == 'true')

    steps:
      - uses: actions/checkout@v4

      - name: Run CodeQL analysis
        uses: github/codeql-action/init@v4
        with:
          languages: typescript
          queries: security-and-quality

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  # ── 6. Docker build validation ────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test, isolation-tests]
    if: >-
      always() &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      needs.test.result == 'success' &&
      (needs.isolation-tests.result == 'success' || needs.isolation-tests.result == 'skipped')

    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, admin-ui]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker # uses runner's local daemon — no Docker Hub pull needed

      - name: Build ${{ matrix.app }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}

  # ── Summary ───────────────────────────────────────────────────────────────
  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    needs: [quality, test, isolation-tests, security]
    if: always() && github.event_name != 'schedule'
    steps:
      - name: Check all required jobs passed or were legitimately skipped
        run: |
          ok() { [[ "$1" == "success" || "$1" == "skipped" ]]; }
          if ! ok "${{ needs.quality.result }}" || \
             ! ok "${{ needs.test.result }}" || \
             ! ok "${{ needs.isolation-tests.result }}" || \
             ! ok "${{ needs.security.result }}"; then
            echo "One or more required CI jobs failed."
            exit 1
          fi
          echo "All required CI jobs passed (or were conditionally skipped)."
