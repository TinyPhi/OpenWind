name: Contribution guardrails

# Enforces the gate-equivalent rules for ALL contributors at PR time (the .claude/ hooks
# are the same checks earlier, as local fast-feedback, but they only bind Claude Code users;
# this is the layer that binds everyone). Separate from ci.yml on purpose.

on:
  pull_request:
    branches: [main, develop]

jobs:
  hook-tests:
    name: Claude hooks unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run hook unit tests
        run: bash scripts/test-claude-hooks.sh

  guardrail-checks:
    name: Gate-equivalent PR checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce contribution guardrails
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-contribution-guardrails.sh "${{ github.event.pull_request.base.sha }}"
